<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="結構化 JSON diff：路徑級新增／刪除／變更。可掛成 Playgrounds 工具。"
    />
    <meta name="sam:tool-kinds" content="viewer:json-diff" />
    <meta name="sam:tool-globs" content="*.json" />
    <title>JSON 結構對照</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.65rem;
      }
      .split textarea {
        min-height: 12rem;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.82rem;
      }
      .diff {
        border: 1px solid var(--line);
        border-radius: 0.55rem;
        background: var(--panel);
        max-height: 22rem;
        overflow: auto;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.8rem;
        padding: 0.35rem 0;
      }
      .diff-line {
        padding: 0.15rem 0.65rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .diff-line.add {
        background: color-mix(in oklab, var(--ok) 14%, transparent);
      }
      .diff-line.del {
        background: color-mix(in oklab, var(--danger) 14%, transparent);
      }
      .diff-line.chg {
        background: color-mix(in oklab, #ca8a04 16%, transparent);
      }
      .top-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        align-items: center;
        justify-content: space-between;
      }
      .path {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.78rem;
        color: var(--muted);
      }
      @media (max-width: 720px) {
        .split {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="hero">
        <h1>JSON 結構對照</h1>
        <p class="tagline">路徑級 diff · 不是純文字行 diff</p>
      </header>

      <div class="top-bar">
        <span id="path-label" class="path">本機試寫</span>
        <div class="controls">
          <button type="button" id="btn-sample" class="secondary">範例</button>
          <button type="button" id="btn-swap" class="secondary">對調</button>
          <button type="button" id="btn-copy" class="secondary">複製</button>
          <button type="button" id="btn-reload" class="secondary" hidden>
            重新載入左檔
          </button>
          <button type="button" id="btn-close" class="secondary" hidden>
            關閉
          </button>
        </div>
      </div>

      <p id="status" class="status" role="status">待命</p>

      <div class="split">
        <label class="field"
          ><span>左（舊／基準）</span>
          <textarea id="left" spellcheck="false"></textarea>
        </label>
        <label class="field"
          ><span>右（新）</span>
          <textarea id="right" spellcheck="false"></textarea>
        </label>
      </div>

      <div id="out" class="diff" aria-live="polite"></div>

      <p class="hint">
        掛成工具時左側載入授權的 <code>.json</code>。Playgrounds
        <a href="https://samkuo.me/playgrounds/">遊樂場</a> 開源小品。
      </p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
